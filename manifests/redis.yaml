apiVersion: v1
kind: Namespace
metadata:
  name: oopservability
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oopservability-redis
  namespace: oopservability
  labels:
    app.kubernetes.io/name: oopservability-redis
    app.kubernetes.io/component: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: oopservability-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: oopservability-redis
        app.kubernetes.io/component: redis
    spec:
      # The regular Redis cache does not need a Kubernetes API credential.
      automountServiceAccountToken: false
      containers:
        - name: redis
          image: ghcr.io/magier/oopservability-redis:sha-b61e524
          imagePullPolicy: Always
          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: oopservability-redis
  namespace: oopservability
  labels:
    app.kubernetes.io/name: oopservability-redis
    app.kubernetes.io/component: redis
spec:
  selector:
    app.kubernetes.io/name: oopservability-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
