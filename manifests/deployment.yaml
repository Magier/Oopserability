# deployment.yaml — Deploys one Oopservability agent replica.
#
# A single Deployment is sufficient for this tutorial and avoids scheduling the
# vulnerable agent onto every node in the cluster.

apiVersion: v1
kind: Namespace
metadata:
  name: oopservability
  labels:
    # Label for easy cleanup: kubectl delete ns oopservability
    app.kubernetes.io/name: oopservability
    app.kubernetes.io/component: tutorial
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oopservability-agent
  namespace: oopservability
  labels:
    app.kubernetes.io/name: oopservability
    app.kubernetes.io/component: agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: oopservability
  template:
    metadata:
      labels:
        app.kubernetes.io/name: oopservability
        app.kubernetes.io/component: agent
    spec:
      serviceAccountName: oopservability-agent
      containers:
        - name: agent
          image: ghcr.io/magier/oopservability:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            # Expose the node selected for this single agent replica so it can
            # build its kubelet proxy URLs.
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: PORT
              value: "8080"
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: varlog
              mountPath: /var/log
              readOnly: true   # agent only reads logs ... supposedly
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10

      volumes:
        # Mount host /var/log so the log search endpoint has something to grep.
        - name: varlog
          hostPath:
            path: /var/log
            type: Directory

---
# Expose the single agent replica inside the cluster.
apiVersion: v1
kind: Service
metadata:
  name: oopservability-agent
  namespace: oopservability
  labels:
    app.kubernetes.io/name: oopservability
spec:
  selector:
    app.kubernetes.io/name: oopservability
  ports:
    - name: http
      port: 8080
      targetPort: 8080
  type: ClusterIP
