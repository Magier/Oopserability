# spog.yaml — "Single Pain of Glass", the legit-looking neighbor.
#
# A boring, hardened, single-replica Deployment that exists purely for
# contrast: this is what a real observability tool's manifest looks like
# next to the agent's DaemonSet + nodes/proxy ClusterRole. It has no RBAC,
# no host mounts, and nothing worth attacking.
apiVersion: v1
kind: Namespace
metadata:
  name: oopservability
  labels:
    app.kubernetes.io/name: oopservability
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spog
  namespace: oopservability
  labels:
    app.kubernetes.io/name: spog
    app.kubernetes.io/component: dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: spog
  template:
    metadata:
      labels:
        app.kubernetes.io/name: spog
        app.kubernetes.io/component: dashboard
    spec:
      automountServiceAccountToken: false
      containers:
        - name: dashboard
          image: ghcr.io/magier/spog:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: PORT
              value: "8080"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: spog
  namespace: oopservability
  labels:
    app.kubernetes.io/name: spog
spec:
  selector:
    app.kubernetes.io/name: spog
  ports:
    - name: http
      port: 8080
      targetPort: 8080
  type: ClusterIP
